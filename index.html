<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুক্রবার ফুটবল ক্লাব - Match Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-500 text-slate-950 p-2.5 rounded-xl font-bold text-xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">Friday Football Club</h1>
                    <p class="text-xs text-slate-400">Match Tracker & Player Stats</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <!-- Add/Edit Player with Photo Section -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-8 shadow-xl">
            <h2 class="text-lg font-bold text-emerald-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-user-plus"></i> প্লেয়ার তৈরি বা আপডেট করুন (ছবিসহ)
            </h2>
            <form id="playerForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">বন্ধুর নাম</label>
                        <input type="text" id="playerName" placeholder="যেমন: সাকিব" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500" required>
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">পজিশন</label>
                        <select id="playerPos" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500">
                            <option value="Forward">Attacker / Forward</option>
                            <option value="Midfielder">Midfielder</option>
                            <option value="Defender">Defender</option>
                            <option value="Goalkeeper">Goalkeeper</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm text-slate-400 mb-1">ছবি আপলোড বা ছবির লিংক (Image URL)</label>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="file" id="playerPhotoFile" accept="image/*" class="text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-500 file:text-slate-950 hover:file:bg-emerald-400 cursor-pointer">
                        <span class="text-slate-500 text-sm self-center">অথবা</span>
                        <input type="url" id="playerPhotoUrl" placeholder="https://example.com/photo.jpg" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">
                    সেভ করুন
                </button>
            </form>
        </div>

        <!-- Player List Preview -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-users"></i> আমাদের প্লেয়ার তালিকা
            </h2>
            <div id="playerList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Players will be rendered here dynamically -->
            </div>
        </div>
    </main>

    <script>
        let players = JSON.parse(localStorage.getItem('ffc_players')) || [];

        const playerForm = document.getElementById('playerForm');
        const playerList = document.getElementById('playerList');

        playerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('playerName').value.trim();
            const pos = document.getElementById('playerPos').value;
            const fileInput = document.getElementById('playerPhotoFile');
            const urlInput = document.getElementById('playerPhotoUrl').value.trim();

            let photoUrl = 'https://ui-avatars.com/api/?background=0D9488&color=fff&name=' + encodeURIComponent(name);

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    savePlayer(name, pos, e.target.result);
                }
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                if (urlInput) photoUrl = urlInput;
                savePlayer(name, pos, photoUrl);
            }
        });

        function savePlayer(name, pos, photo) {
            const newPlayer = { id: Date.now(), name, pos, photo };
            players.push(newPlayer);
            localStorage.setItem('ffc_players', JSON.stringify(players));
            playerForm.reset();
            renderPlayers();
        }

        function renderPlayers() {
            playerList.innerHTML = '';
            if (players.length === 0) {
                playerList.innerHTML = `<p class="text-slate-400 text-sm col-span-full text-center">এখনো কোনো প্লেয়ার যোগ করা হয়নি।</p>`;
                return;
            }
            players.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-700 rounded-xl p-4 flex items-center gap-4";
                card.innerHTML = `
                    <img src="${p.photo}" alt="${p.name}" class="w-14 h-14 rounded-full object-cover border-2 border-emerald-500">
                    <div>
                        <h3 class="font-bold text-white text-base">${p.name}</h3>
                        <span class="text-xs text-emerald-400 bg-emerald-950 px-2.5 py-0.5 rounded-full border border-emerald-800">${p.pos}</span>
                    </div>
                `;
                playerList.appendChild(card);
            });
        }

        renderPlayers();
    </script>
</body>
</html>
