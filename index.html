<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Football Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-500 text-slate-950 p-2.5 rounded-xl font-bold text-xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">Friday Football Club</h1>
                    <p class="text-xs text-slate-400">Match Tracker & Player Stats</p>
                </div>
            </div>
            <button onclick="openAdminModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 text-xs px-3 py-2 rounded-xl flex items-center gap-2 transition">
                <i class="fa-solid fa-lock" id="adminIcon"></i>
                <span id="adminText">অ্যাডমিন লগইন</span>
            </button>
        </div>
    </header>

    <!-- Admin Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-emerald-400"></i> অ্যাডমিন লগইন
                </h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-400">পাসওয়ার্ড দিন (ডিফল্ট: 1234)</p>
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড লিখুন" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            <p id="errorMsg" class="text-xs text-rose-500 hidden">ভুল পাসওয়ার্ড!</p>
            <div class="flex gap-2">
                <button onclick="closeAdminModal()" class="flex-1 bg-slate-700 text-slate-300 py-2 rounded-xl text-xs">বাতিল</button>
                <button onclick="checkAdmin()" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2 rounded-xl text-xs">লগইন</button>
            </div>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-4 py-6 space-y-8">

        <!-- Admin Banner -->
        <div id="adminBanner" class="hidden bg-emerald-950/60 border border-emerald-500/40 rounded-2xl p-4 flex justify-between items-center text-sm text-emerald-300">
            <span><i class="fa-solid fa-circle-check mr-2"></i> অ্যাডমিন মোড এক্টিভ! আপনি এখন নতুন প্লেয়ার ও ম্যাচ যোগ করতে পারবেন।</span>
            <button onclick="logoutAdmin()" class="text-xs bg-rose-500/20 text-rose-300 border border-rose-500/30 px-3 py-1 rounded-lg">লগআউট</button>
        </div>

        <!-- Section 1: Players -->
        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-users text-emerald-400"></i> প্লেয়ার প্রোফাইল
            </h2>

            <!-- Add Player (Admin Only) -->
            <div id="addPlayerBox" class="hidden bg-slate-900 p-4 rounded-xl mb-6 border border-slate-700">
                <h3 class="text-sm font-bold text-emerald-400 mb-3">+ নতুন প্লেয়ার যোগ করুন</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" id="pName" placeholder="নাম" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    <select id="pPos" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                        <option value="Attacker">Attacker</option>
                        <option value="Midfielder">Midfielder</option>
                        <option value="Defender">Defender</option>
                        <option value="Goalkeeper">Goalkeeper</option>
                    </select>
                    <button onclick="addPlayer()" class="bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl text-sm">সেভ করুন</button>
                </div>
            </div>

            <div id="playersGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </section>

        <!-- Section 2: Matches -->
        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-trophy text-amber-400"></i> ম্যাচ রেজাল্ট
            </h2>

            <!-- Add Match (Admin Only) -->
            <div id="addMatchBox" class="hidden bg-slate-900 p-4 rounded-xl mb-6 border border-slate-700 space-y-3">
                <h3 class="text-sm font-bold text-amber-400">+ নতুন ম্যাচের রেজাল্ট দিন</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="date" id="mDate" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    <input type="text" id="mWinner" placeholder="বিজয়ী দল (যেমন: Team A)" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    <input type="text" id="mScore" placeholder="স্কোর (যেমন: 3 - 1)" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                </div>
                <button onclick="addMatch()" class="w-full bg-amber-500 text-slate-950 font-bold py-2 rounded-xl text-sm">ম্যাচ সেভ করুন</button>
            </div>

            <div id="matchesList" class="space-y-4"></div>
        </section>

    </main>

    <script>
        let isAdmin = false;
        let players = JSON.parse(localStorage.getItem('ffc_p_clean')) || [];
        let matches = JSON.parse(localStorage.getItem('ffc_m_clean')) || [];

        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
        }
        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function checkAdmin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === "1234") {
                isAdmin = true;
                closeAdminModal();
                updateUI();
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            updateUI();
        }

        function updateUI() {
            if (isAdmin) {
                document.getElementById('adminBanner').classList.remove('hidden');
                document.getElementById('addPlayerBox').classList.remove('hidden');
                document.getElementById('addMatchBox').classList.remove('hidden');
                document.getElementById('adminText').innerText = "অ্যাডমিন (Active)";
            } else {
                document.getElementById('adminBanner').classList.add('hidden');
                document.getElementById('addPlayerBox').classList.add('hidden');
                document.getElementById('addMatchBox').classList.add('hidden');
                document.getElementById('adminText').innerText = "অ্যাডমিন লগইন";
            }
        }

        function addPlayer() {
            const name = document.getElementById('pName').value.trim();
            const pos = document.getElementById('pPos').value;
            if (!name) return alert("নাম লিখুন!");
            
            players.push({ name, pos });
            localStorage.setItem('ffc_p_clean', JSON.stringify(players));
            document.getElementById('pName').value = '';
            renderPlayers();
        }

        function renderPlayers() {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = players.length ? '' : '<p class="text-slate-400 text-sm col-span-full text-center">কোনো প্লেয়ার যোগ করা হয়নি।</p>';
            players.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 flex items-center gap-3">
                        <img src="https://ui-avatars.com/api/?background=0D9488&color=fff&name=${encodeURIComponent(p.name)}" class="w-10 h-10 rounded-full">
                        <div>
                            <h4 class="font-bold text-white text-sm">${p.name}</h4>
                            <span class="text-xs text-emerald-400">${p.pos}</span>
                        </div>
                    </div>
                `;
            });
        }

        function addMatch() {
            const date = document.getElementById('mDate').value;
            const winner = document.getElementById('mWinner').value.trim();
            const score = document.getElementById('mScore').value.trim();
            if (!winner || !score) return alert("সব ঘর পূরণ করুন!");

            matches.unshift({ date: date || 'সাম্প্রতিক', winner, score });
            localStorage.setItem('ffc_m_clean', JSON.stringify(matches));
            document.getElementById('mWinner').value = '';
            document.getElementById('mScore').value = '';
            renderMatches();
        }

        function renderMatches() {
            const list = document.getElementById('matchesList');
            list.innerHTML = matches.length ? '' : '<p class="text-slate-400 text-sm text-center">কোনো ম্যাচের রেকর্ড নেই।</p>';
            matches.forEach(m => {
                list.innerHTML += `
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                        <div>
                            <span class="text-xs text-slate-400">${m.date}</span>
                            <h3 class="font-bold text-amber-400">🏆 বিজয়ী: ${m.winner}</h3>
                        </div>
                        <span class="text-sm font-bold text-white bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">${m.score}</span>
                    </div>
                `;
            });
        }

        renderPlayers();
        renderMatches();
    </script>
</body>
</html>
